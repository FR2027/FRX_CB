<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRX CB | 量子方塊 v17.2.1</title>
       <meta name="description" content="歡迎來到FRX CB 量子方塊，點擊螢幕展開量子穿梭 本遊戲為2025.12/7由FR科技公司製作 2026.10/5由FRX重新上架！">
    <meta name="keywords" content="FR, FRX, FRX CB, 量子方塊, FRX 台灣, 街機遊戲">
    
    <link rel="icon" href="https://i.ibb.co/G4FNMK2M/photo-output.webp" type="image/webp">
    <link rel="apple-touch-icon" href="https://i.ibb.co/G4FNMK2M/photo-output.webp">
    <meta name="google-site-verification" content="D2jjOhjMZmOG8zwCgpx7-W__kj6AS2vNOUrsyrp8OGA" />

    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --neon: #8A2BE2; --neon-alt: #00ffff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Microsoft JhengHei', sans-serif; touch-action: none; color: white; }
        .overlay { position: absolute; inset: 0; z-index: 8000; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); transition: opacity 0.5s; }
        .panel { padding: 30px; text-align: center; border-radius: 16px; border: 2px solid var(--neon); background: rgba(10,10,10,0.95); width: 85%; max-width: 400px; box-shadow: 0 0 30px rgba(138,43,226,0.4); }
        #shop-menu { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.96); display: none; padding: 25px; overflow-y: auto; }
        .skin-section { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; margin-top: 10px; }
        .skin-card { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid #444; transition: 0.2s; }
        .skin-card:hover { transform: scale(1.05); border-color: var(--neon-alt); }
        .btn-pause { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(138,43,226,0.3); border: 2px solid var(--neon); color: white; border-radius: 50%; z-index: 1000; cursor: pointer; display: none; font-size: 20px; transition: 0.2s; }
        .btn-pause:hover { background: var(--neon); box-shadow: 0 0 15px var(--neon); }
        
        #boost-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 150px; height: 50px; background: rgba(0, 255, 255, 0.1); border: 2px solid var(--neon-alt); color: var(--neon-alt); border-radius: 10px; z-index: 1000; cursor: pointer; display: none; font-weight: bold; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; }
        #boost-btn.active-boost { background: var(--neon-alt); color: black; box-shadow: 0 0 25px var(--neon-alt); }

        .score-ui { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); font-size: 36px; font-weight: 900; color: var(--neon-alt); text-shadow: 0 0 20px var(--neon-alt); z-index: 1000; pointer-events: none; }
        #win-msg { position: absolute; bottom: 20%; width: 100%; text-align: center; color: gold; font-size: 28px; font-weight: bold; display: none; z-index: 5000; text-shadow: 0 0 15px gold; animation: blink 1s infinite; }
        button.primary { width: 100%; padding: 18px; background: var(--neon); border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 18px; margin-top: 10px; transition: 0.2s; box-shadow: 0 0 15px rgba(138,43,226,0.4); }
        button.primary:hover { background: #9d4edd; box-shadow: 0 0 25px var(--neon); }
        @keyframes blink { 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay" onclick="handleStart()">
        <h1 style="letter-spacing:12px; color: var(--neon-alt); text-align:center; text-shadow: 0 0 20px var(--neon-alt);">FRX 量子方塊<br><span style="font-size:16px; letter-spacing:3px; color:white;">v17.2.1 旗艦版</span></h1>
        <p style="animation: blink 1.5s infinite; margin-top:25px; font-size: 18px; color: #00ffff;">點擊螢幕展開量子穿梭 本遊戲為2025.12/7由FR科技公司製作 2026.10/5由FRX重新上架</p>
    </div>

    <div id="shop-menu">
        <h2 style="text-align:center; color:var(--neon-alt); text-shadow: 0 0 10px var(--neon-alt);">FRX 高階皮膚自定義系統</h2>
        <div class="skin-section"><label>上傳外觀</label><input type="file" id="img-upload" accept="image/*" onchange="uploadImage(this)" style="margin-top:8px; display:block;"></div>
        <div class="skin-section"><label>自定義發光核心顏色</label><input type="color" id="color-picker" value="#8A2BE2" onchange="setCustomColor(this.value)" style="margin-top:8px; display:block; width:100px; height:40px; border:none; background:none; cursor:pointer;"></div>
        <div class="skin-section"><label>極緻幻彩漸層預設</label><div class="skin-grid" id="grad-list"></div></div>
        <button class="primary" onclick="resumeGame()">套用設定並返回遊戲</button>
    </div>

    <div id="death-screen" class="overlay" style="display:none;">
        <div class="panel">
            <h2 style="color:#ff4444; text-shadow: 0 0 10px #ff4444;">連線中斷</h2>
            <p id="final-score" style="font-size:32px; margin: 25px 0; font-weight:bold;"></p>
            <button class="primary" onclick="location.reload()">重新開始</button>
        </div>
    </div>

    <div id="win-msg">你已成功突破 FRX 終極量子核心！</div>
    <div class="score-ui" id="ui-score">0</div>
    <button class="btn-pause" id="pause-btn" onclick="pauseGame()">||</button>
    
    <button id="boost-btn">加速：OFF</button>

    <script>
        let scene, camera, renderer, player, animID;
        let isPlaying = false, isPaused = false, isTransitioning = false, hasWon = false;
        let isBoosting = false; 
        let score = 0, currentSpeed = 0.5, baseSpeed = 0.55;
        let lane = 0, lanes = [-2.2, 0, 2.2];
        let obstacles = [], particles = [], sideLines = [];

        const GRADIENTS = [
            ['#ff007f', '#7928ca'], 
            ['#00f2fe', '#4facfe'], 
            ['#f093fb', '#f5576c'], 
            ['#5eeff9', '#4568dc'], 
            ['#8A2BE2', '#00ffff'],
            ['#ffe600', '#ff3366']
        ];

        init();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020005, 0.025);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            camera.position.set(15, 8, 12);
            camera.lookAt(0, 0, -10);

            // 精緻賽道與地面光影
            const floorGeo = new THREE.PlaneGeometry(35, 2000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x05020a, roughness: 0.2, metalness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(1000, 100, 0x8A2BE2, 0x220044);
            grid.position.y = 0.02;
            scene.add(grid);

            for(let x of [-4.8, 4.8]) {
                const line = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 1000), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8 }));
                line.position.set(x, 0.08, 0);
                scene.add(line);
                sideLines.push(line);
            }

            // 高質感玩家方塊
            player = new THREE.Mesh(
                new THREE.BoxGeometry(0.9, 0.9, 0.9), 
                new THREE.MeshStandardMaterial({ color: 0x8A2BE2, emissive: 0x8A2BE2, emissiveIntensity: 0.7, roughness: 0.1, metalness: 0.5 })
            );
            player.position.y = 0.48;
            scene.add(player);

            // 豐富燈光設定
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pointLight = new THREE.PointLight(0x00ffff, 2, 50);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            renderGradients();

            // 超載加速按鈕邏輯
            const bBtn = document.getElementById('boost-btn');
            const toggleBoost = (e) => {
                e.preventDefault();
                e.stopPropagation();
                isBoosting = !isBoosting; 
                
                if(isBoosting) {
                    bBtn.classList.add('active-boost');
                    bBtn.innerText = "加速：ON";
                } else {
                    bBtn.classList.remove('active-boost');
                    bBtn.innerText = "加速：OFF";
                }
            };
            
            bBtn.addEventListener('touchstart', toggleBoost);
            bBtn.addEventListener('mousedown', toggleBoost);

            // 觸控與滑鼠操控
            const handleInput = (clientX, clientY) => {
                if(!isPlaying || isPaused) return;
                if (clientY < 85 && clientX > window.innerWidth - 85) return; 
                if (clientY > window.innerHeight - 100 && clientX > window.innerWidth/4 && clientX < (window.innerWidth*3)/4) return;

                if (clientX < window.innerWidth / 2) {
                    lane = Math.max(-1, lane - 1);
                } else {
                    lane = Math.min(1, lane + 1);
                }
            };

            window.addEventListener('touchstart', e => handleInput(e.touches[0].clientX, e.touches[0].clientY));
            window.addEventListener('mousedown', e => {
                if (e.button === 0) handleInput(e.clientX, e.clientY);
            });
            
            // 鍵盤控制
            window.addEventListener('keydown', e => {
                if(!isPlaying || isPaused) return;
                const key = e.key.toLowerCase();
                if(key === "arrowleft" || key === "a") lane = Math.max(-1, lane - 1);
                if(key === "arrowright" || key === "d") lane = Math.min(1, lane + 1);
            });

            loop();
        }

        function loop() {
            animID = requestAnimationFrame(loop);
            if(!isPlaying || isPaused) { renderer.render(scene, camera); return; }

            let normalSpeed = score < 300 ? baseSpeed + (score * 0.005) : baseSpeed + (300 * 0.005);
            currentSpeed = (isBoosting && score < 60) ? normalSpeed * 1.6 : normalSpeed;

            const bBtn = document.getElementById('boost-btn');
            if (score < 60) {
                bBtn.style.display = 'block';
            } else {
                bBtn.style.display = 'none';
                isBoosting = false; 
            }

            if (score >= 7500 && !hasWon) {
                hasWon = true;
                document.getElementById('win-msg').style.display = 'block';
            }

            player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[lane + 1], 0.25);

            // 動態殘影特效
            if(Math.random() > 0.2) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.85, 0.85, 0.85), 
                    new THREE.MeshBasicMaterial({ color: player.material.color, map: player.material.map, transparent: true, opacity: 0.55 })
                );
                p.position.set(player.position.x, 0.48, player.position.z);
                scene.add(p);
                particles.push(p);
            }
            particles.forEach((p, i) => {
                p.position.z += currentSpeed * 0.5;
                p.material.opacity -= 0.035;
                p.scale.multiplyScalar(0.94);
                if(p.material.opacity <= 0) { scene.remove(p); particles.splice(i, 1); }
            });

            if(Math.random() < 0.045 + (score * 0.0001)) {
                const canSpawn = obstacles.length === 0 || obstacles[obstacles.length-1].position.z > -80;
                if(canSpawn) spawn();
            }

            obstacles.forEach((o, i) => {
                o.position.z += currentSpeed;
                o.rotation.x += 0.02;
                o.rotation.y += 0.03;
                if(Math.abs(player.position.x - o.position.x) < 0.85 && Math.abs(player.position.z - o.position.z) < 0.85) endGame();
                if(o.position.z > 10) { scene.remove(o); obstacles.splice(i, 1); score++; updateUI(); }
            });

            sideLines.forEach(l => l.position.z = (l.position.z + currentSpeed) % 50);
            renderer.render(scene, camera);
        }

        function spawn() {
            const count = Math.random() > 0.8 ? 2 : 1;
            const available = [0, 1, 2].sort(() => Math.random() - 0.5);
            for(let i = 0; i < count; i++) {
                const obs = new THREE.Mesh(
                    new THREE.BoxGeometry(1.2, 1.2, 1.2), 
                    new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8, roughness: 0.1 })
                );
                obs.position.set(lanes[available[i]], 0.6, -110);
                scene.add(obs);
                obstacles.push(obs);
            }
        }

        function handleStart() {
            if(isTransitioning) return;
            isTransitioning = true;
            document.getElementById('start-screen').style.opacity = '0';
            const startTime = performance.now();
            function step(now) {
                const p = Math.min((now - startTime) / 1400, 1);
                const t = 1 - Math.pow(1 - p, 4);
                camera.position.set(15 + (0-15)*t, 8 + (4.5-8)*t, 12 + (8-12)*t);
                camera.lookAt(0, 0, -2);
                if(p < 1) requestAnimationFrame(step);
                else { document.getElementById('start-screen').style.display = 'none'; document.getElementById('pause-btn').style.display = 'block'; isPlaying = true; }
            }
            requestAnimationFrame(step);
        }

        function setCustomColor(c) { 
            player.material = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.7, roughness: 0.1, metalness: 0.5 }); 
        }

        function uploadImage(input) { 
            if (input.files[0]) { 
                const reader = new FileReader(); 
                reader.onload = (e) => { 
                    new THREE.TextureLoader().load(e.target.result, (texture) => {
                        player.material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.2 });
                    });
                }; 
                reader.readAsDataURL(input.files[0]); 
            } 
        }

        function renderGradients() {
            const list = document.getElementById('grad-list');
            list.innerHTML = "";
            GRADIENTS.forEach(colors => {
                const card = document.createElement('div'); 
                card.className = "skin-card"; 
                card.style.background = `linear-gradient(45deg, ${colors[0]}, ${colors[1]})`;
                card.onclick = () => {
                    const canvas = document.createElement('canvas'); 
                    canvas.width = 256; canvas.height = 256; 
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0, 0, 256, 256); 
                    grad.addColorStop(0, colors[0]); grad.addColorStop(1, colors[1]);
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
                    const texture = new THREE.CanvasTexture(canvas);
                    player.material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.1, metalness: 0.4 });
                };
                list.appendChild(card);
            });
        }

        function pauseGame() { isPaused = true; document.getElementById('shop-menu').style.display = 'block'; }
        function resumeGame() { isPaused = false; document.getElementById('shop-menu').style.display = 'none'; }
        function updateUI() { document.getElementById('ui-score').innerText = score; }
        function endGame() { isPlaying = false; isBoosting = false; document.getElementById('death-screen').style.display = 'flex'; document.getElementById('final-score').innerText = `最終量子積分: ${score}`; }
        
        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
    </script>
</body>
</html>
